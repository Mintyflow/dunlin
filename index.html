    <!-- Structured Data — FAQPage (AEO: AI tools cite structured FAQ answers directly) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Dunlin?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Dunlin is a UK lease intelligence platform for flex space operators and serviced office brokers. It searches Apollo's database of 270M+ contacts, cross-references UK Companies House data to estimate lease expiry dates, and scores every lead with a proprietary Space Pressure Score (0–100) combining lease urgency, headcount growth, recent funding, and decision-maker seniority."
          }
        },
        {
          "@type": "Question",
          "name": "What is the Space Pressure Score?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Space Pressure Score is a proprietary 0–100 urgency score calculated for every contact in Dunlin. It combines four signals: estimated lease expiry (how close a company is to renewal), headcount growth (are they expanding?), recent funding rounds (do they have budget to move?), and decision-maker seniority (are they the person who signs the deal?). A score of 70 or above means HOT — the company likely needs new space right now."
          }
        },
        {
          "@type": "Question",
          "name": "How does Dunlin estimate lease expiry dates?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Dunlin cross-references Apollo contact data with UK Companies House filings to estimate when a company's lease is likely to expire. It analyses incorporation date, registered address history, and company size to generate an estimated renewal window. The platform is also building a direct HM Land Registry integration to replace estimates with confirmed registered lease dates."
          }
        },
        {
          "@type": "Question",
          "name": "How is Dunlin different from Apollo.io?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Apollo.io is a general-purpose contact database with no UK lease intelligence. It has no Companies House integration, no lease expiry data, lower UK email accuracy (~65–70%), and requires a minimum of 3 users on the Organisation plan (approximately £280/month). Dunlin is purpose-built for UK flex space operators, combining Apollo's contact data with Companies House lease estimates, a proprietary Space Pressure Score, and a Renewal Radar calendar — starting from £99/month for a single user."
          }
        },
        {
          "@type": "Question",
          "name": "How is Dunlin different from VTS or CoStar?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "VTS and CoStar are enterprise tools built for landlords and commercial property brokers, costing £10,000–£40,000 per year. They are designed to manage existing portfolios, not to find new outbound clients. Dunlin is purpose-built for flex space operators doing outbound business development — finding companies that need space, scoring them by urgency, and enabling direct outreach."
          }
        },
        {
          "@type": "Question",
          "name": "Does Dunlin work for the whole UK?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Dunlin searches Apollo's UK database covering all UK cities, and cross-references Companies House which covers all companies registered in England, Wales, Scotland, and Northern Ireland. Users can search by city, postcode, or area."
          }
        },
        {
          "@type": "Question",
          "name": "How much does Dunlin cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Dunlin offers three plans: Starter at £99/month (single user), Growth at £179/month (small team), and Pro at £349/month (unlimited users). Annual billing saves 20%. All plans include a 14-day free trial with no credit card required."
          }
        }
      ]
    }
    </script>
